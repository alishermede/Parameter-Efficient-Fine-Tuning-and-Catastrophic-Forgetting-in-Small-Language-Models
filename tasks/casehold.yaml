# CaseHOLD test subset (500 items) as an lm-eval multiple-choice task, log-likelihood over A-E.
# Not part of lm-eval; reads the file written by src/prepare_data.py (verified by SHA-256).
# Relative path: src/eval.py runs lm-eval from the repository root.
task: casehold_test
dataset_path: json
dataset_kwargs:
  data_files:
    test: data/test/casehold_test.jsonl
output_type: multiple_choice
test_split: test
description: "The following is an excerpt from a U.S. court opinion. Choose the holding that correctly fills the <HOLDING> placeholder.\n\n"
doc_to_text: "{{question.strip()}}\nA. {{options[0].strip()}}\nB. {{options[1].strip()}}\nC. {{options[2].strip()}}\nD. {{options[3].strip()}}\nE. {{options[4].strip()}}\nAnswer:"
doc_to_choice: ["A", "B", "C", "D", "E"]
doc_to_target: label
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
