# Data sources and sampling. Revisions pinned to the commits resolved in the pilot on 2026-11-02
# (data/manifest.json -> resolved_revisions).

seed: 2026
ngram: 13                     # word 13-grams for decontamination (Brown et al., 2020)

sizes:
  train_per_domain: 2000
  dev_per_domain: 200
  test_medmcqa: 500           # from the official validation split (test labels are not public)
  test_casehold: 500
  test_gsm8k: 500             # of 1,319
  mmlu_per_subject: 30        # 42 primary subjects -> 1,260; 15 overlapping subjects -> 450

sources:
  medmcqa:
    repo: openlifescienceai/medmcqa
    config: null
    revision: 91c6572c454088bf71b679ad90aa8dffcd0d5868
  casehold:
    repo: coastalcph/lex_glue
    config: case_hold
    revision: c23fdff1a6bf74e0e1a71cb86f1e781d37da888c
    fallback_repo: casehold/casehold
    fallback_config: all
  codealpaca:
    repo: sahil2801/CodeAlpaca-20k
    config: null
    revision: 152bb5e9a29651266b018106053980070a0521a1
  mbpp:
    repo: google-research-datasets/mbpp
    config: full
    revision: 4bb6404fdc6cacfda99d4ac4205087b89d32030c
  mmlu:
    repo: cais/mmlu
    revision: c30699e8356da336a370243923dbaf21066bb9fe
  gsm8k:
